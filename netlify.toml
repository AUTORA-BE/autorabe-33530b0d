# Netlify configuration for autora.be
# - Builds the Vite SPA (output: dist/)
# - Runs the og-meta Edge Function on public garage/listing routes to serve
#   dynamic Open Graph / Twitter / JSON-LD HTML for social crawlers.
# - Falls back to index.html for SPA client-side routing.

[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

# ── Build environment ──────────────────────────────────────────────────────
# The Netlify secrets scanner flags the Supabase URL + the public anon key
# because Vite inlines them into dist/ during the build. These keys are NOT
# secrets — they are intentionally public and protected by RLS at the
# database level. We omit them from scanning so the deploy is not blocked,
# but keep the scanner ACTIVE so any real secret leak (e.g. service_role,
# Stripe sk_live_, Resend API key) is still caught.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY"


# ── SPA fallback ───────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
