    <!-- Security Headers
         Note: HSTS (Strict-Transport-Security) cannot be set via <meta> per spec —
         it is enforced via the HTTP response header in public/_headers (Lovable Cloud / Netlify).
         CSP: 'unsafe-eval' removed (production builds of Recharts/Framer Motion don't need it).
         'unsafe-inline' on script-src kept for the inline anti-FOUC theme script
         in <head>. To harden further, replace with a sha256-<hash> for that script. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(self), geolocation=(), payment=()" />

    <link rel="dns-prefetch" href="https://images.unsplash.com">    <!-- LCP optimisation: the homepage hero is the Largest Contentful Paint.
         Preloading it here (stable /public URL) starts the fetch during HTML
         parse — before the React bundle boots — instead of after, which is the
         single biggest LCP win for an SPA. The <img> in HeroSearch.tsx uses the
         exact same URL so the preload is reused (no double download). -->
    <link rel="preload" href="/hero-marketplace.jpg" as="image" fetchpriority="high" />
    <style>
      /* Critical inline CSS to speed up FCP and avoid CLS across devices */
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
      html,body{background:#0c1221;color:#f0f4f8}
      html.light,html.light body{background:#f5f8fc;color:#0a1628}
      body{font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden}
      #root{min-height:100vh;min-height:100dvh}
      img{max-width:100%;height:auto;display:block}
      /* Avoid layout shift while React mounts */
      #root:empty::before{content:"";display:block;height:100vh;height:100dvh}
      /* Instant LCP/FCP shell — painted before React boots, replaced on mount.
         The hero <img> here is the LCP element; since it is preloaded it paints
         in ~1-1.5s without waiting for the JS bundle. */
      #app-shell{position:fixed;inset:0;overflow:hidden;background:#0a0a14}
      #app-shell .sh-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
      #app-shell .sh-grad{position:absolute;inset:0;background:linear-gradient(to top,#0a0a14 0%,rgba(10,10,20,.72) 45%,rgba(10,10,20,.25) 100%)}
      #app-shell .sh-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
      #app-shell .sh-logo{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:22px;letter-spacing:-.02em;color:#fff;opacity:.95}
      #app-shell .sh-spin{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.22);border-top-color:#10b981;border-radius:50%;animation:autora-spin .8s linear infinite}
      @keyframes autora-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#app-shell .sh-spin{animation:none}}
    </style>
    <script>
      /* Anti-FOUC : applique le theme AVANT le rendu React pour éviter le flash */
      (function(){
        try {
          var stored = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && true); // defaultTheme="dark"
          if (stored === 'light') isDark = false;
          if (stored === 'system') isDark = systemDark;
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
