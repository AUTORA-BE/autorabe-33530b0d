<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer black ring -->
  <circle cx="100" cy="100" r="99" fill="#000"/>
  <!-- Inner white circle area -->
  <circle cx="100" cy="100" r="82" fill="#fff"/>
  <!-- Blue quadrants: top-right and bottom-left -->
  <path d="M100 18 A82 82 0 0 1 182 100 L100 100Z" fill="#1C69D4"/>
  <path d="M100 182 A82 82 0 0 1 18 100 L100 100Z" fill="#1C69D4"/>
  <!-- Cross dividers -->
  <line x1="100" y1="18" x2="100" y2="182" stroke="#000" stroke-width="2"/>
  <line x1="18" y1="100" x2="182" y2="100" stroke="#000" stroke-width="2"/>
  <!-- Thin inner ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#000" stroke-width="3"/>
  <!-- BMW text in outer ring -->
  <text x="100" y="63" text-anchor="middle" font-size="16" font-family="Helvetica Neue,Arial,sans-serif" font-weight="bold" fill="#fff" letter-spacing="5">BMW</text>
  <text x="100" y="150" text-anchor="middle" font-size="16" font-family="Helvetica Neue,Arial,sans-serif" font-weight="bold" fill="#fff" letter-spacing="5">BMW</text>
</svg>
