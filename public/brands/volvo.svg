<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Volvo: iron/male symbol — circle + arrow diagonal upper-right -->
  <!-- Background circle fill for context -->
  <circle cx="88" cy="112" r="74" fill="none" stroke="#003B8E" stroke-width="12"/>
  <!-- Arrow shaft + head pointing upper-right -->
  <!-- Diagonal line from circle edge to top-right corner -->
  <line x1="140" y1="62" x2="185" y2="18" stroke="#003B8E" stroke-width="12" stroke-linecap="round"/>
  <!-- Arrowhead at top-right -->
  <polyline points="155,18 185,18 185,48" fill="none" stroke="#003B8E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- VOLVO wordmark inside circle -->
  <text x="88" y="118" text-anchor="middle" font-size="22" font-family="Helvetica Neue,Arial,sans-serif" font-weight="bold" fill="#003B8E" letter-spacing="2">VOLVO</text>
</svg>
