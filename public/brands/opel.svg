<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Opel: circle with lightning bolt (Blitz) -->
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#FFD100" stroke-width="8"/>
  <!-- Inner circle fill (subtle) -->
  <circle cx="100" cy="100" r="90" fill="#1D1D1B"/>
  <!-- Lightning bolt / Blitz: angular zigzag from top-right to bottom-left -->
  <path d="
    M120 28
    L78 90
    L108 90
    L80 172
    L142 100
    L110 100
    Z
  " fill="#FFD100"/>
</svg>
