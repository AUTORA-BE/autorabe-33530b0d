<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Renault 2021 diamond logo -->
  <!-- Outer diamond (rotated square) -->
  <g transform="translate(100,100)">
    <!-- Outer outline diamond -->
    <path d="M0,-88 L62,0 L0,88 L-62,0 Z" fill="none" stroke="#EFDF00" stroke-width="8"/>
    <!-- Inner diamond (cut out effect) -->
    <path d="M0,-55 L38,0 L0,55 L-38,0 Z" fill="none" stroke="#EFDF00" stroke-width="7"/>
    <!-- Vertical bar connecting top to bottom through center -->
    <line x1="0" y1="-88" x2="0" y2="88" stroke="#EFDF00" stroke-width="8"/>
    <!-- Angled connecting bars (left and right inner facets) -->
    <line x1="-62" y1="0" x2="-38" y2="0" stroke="#EFDF00" stroke-width="7"/>
    <line x1="38" y1="0" x2="62" y2="0" stroke="#EFDF00" stroke-width="7"/>
    <!-- Upper inner facet lines -->
    <line x1="0" y1="-88" x2="-38" y2="0" stroke="#EFDF00" stroke-width="7"/>
    <line x1="0" y1="-88" x2="38" y2="0" stroke="#EFDF00" stroke-width="7"/>
    <!-- Lower inner facet lines -->
    <line x1="0" y1="88" x2="-38" y2="0" stroke="#EFDF00" stroke-width="7"/>
    <line x1="0" y1="88" x2="38" y2="0" stroke="#EFDF00" stroke-width="7"/>
  </g>
</svg>
