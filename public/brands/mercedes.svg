<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer thin ring -->
  <circle cx="100" cy="100" r="99" fill="none" stroke="#999" stroke-width="3"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="94" fill="#fff"/>
  <!-- Three-pointed star: center point down, two upper -->
  <!-- Star drawn from center outward, 3 branches at 0°, 120°, 240° (tip at top = 270°=bottom, so tips at 90°,210°,330°) -->
  <!-- Tip top: (100, 100-72) = (100,28) -->
  <!-- Tip bottom-right: 100+72*sin(120°)=100+62.4, 100+72*cos(120°)/=100+36 = (162, 136) -->
  <!-- Tip bottom-left: 100-62.4, 136 = (38, 136) -->
  <!-- Star shape: triangle from center to each tip with wing width -->
  <path d="
    M100 100
    L91 32 Q100 22 109 32 Z
    M100 100
    L163 140 Q169 131 161 124 Z
    M100 100
    L37 140 Q31 131 39 124 Z
  " fill="#999" opacity="0.85"/>
  <!-- Central circle -->
  <circle cx="100" cy="100" r="8" fill="#999"/>
  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#bbb" stroke-width="1.5"/>
</svg>
