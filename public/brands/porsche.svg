<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Porsche crest: shield with antlers and horse -->
  <!-- Shield outline -->
  <path d="M100 8 L190 40 L190 145 Q190 210 100 232 Q10 210 10 145 L10 40 Z"
    fill="#fff" stroke="#8B1A1A" stroke-width="5"/>
  <!-- Shield interior (divided into sections) -->
  <!-- Left quadrants (red and black) -->
  <path d="M100 8 L10 40 L10 95 L100 95 Z" fill="#8B1A1A"/>
  <path d="M100 95 L10 95 L10 145 Q10 175 38 195 L100 215 Z" fill="#1D1D1B"/>
  <!-- Right quadrants -->
  <path d="M100 8 L190 40 L190 95 L100 95 Z" fill="#1D1D1B"/>
  <path d="M100 95 L190 95 L190 145 Q190 175 162 195 L100 215 Z" fill="#8B1A1A"/>
  <!-- Center vertical divider -->
  <line x1="100" y1="8" x2="100" y2="232" stroke="#8B1A1A" stroke-width="5"/>
  <!-- Center horizontal divider -->
  <line x1="10" y1="95" x2="190" y2="95" stroke="#8B1A1A" stroke-width="5"/>
  <!-- Horse silhouette (center of shield, simplified) -->
  <g transform="translate(100,120)">
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="18" ry="12" fill="#8B1A1A" opacity="0"/>
    <!-- Simplified horse: head, neck, body -->
    <path d="M-5,-28 Q5,-38 12,-32 Q18,-26 14,-18 L8,-8 L18,8 L10,25 L-10,25 L-18,8 L-14,-18 Q-18,-26 -12,-32 Z"
      fill="#8B1A1A" opacity="0.9"/>
  </g>
  <!-- Antler decoration top -->
  <path d="M72 40 L60 25 M72 40 L55 35 M128 40 L140 25 M128 40 L145 35" stroke="#FFD100" stroke-width="3" stroke-linecap="round"/>
  <!-- Shield border overlay -->
  <path d="M100 8 L190 40 L190 145 Q190 210 100 232 Q10 210 10 145 L10 40 Z"
    fill="none" stroke="#8B1A1A" stroke-width="5"/>
</svg>
