<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <title>AutoRa — Hors ligne</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, hsla(150,80%,40%,.18), transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, hsla(150,60%,30%,.12), transparent 70%),
        #08080d;
      color:#e7e7ec;
      min-height:100dvh;
      display:flex;align-items:center;justify-content:center;
      text-align:center;padding:2rem;
      padding-top:max(2rem,env(safe-area-inset-top));
      padding-bottom:max(2rem,env(safe-area-inset-bottom));
      -webkit-font-smoothing:antialiased;
      letter-spacing:-0.01em;
    }
    .card{
      max-width:380px;width:100%;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border-radius:28px;
      padding:2.5rem 1.75rem;
      box-shadow:0 30px 80px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset;
    }
    .logo{
      width:72px;height:72px;margin:0 auto 1.75rem;
      border-radius:20px;overflow:hidden;
      box-shadow:0 12px 32px -8px hsla(150,80%,40%,.4);
      background:#0a0a14;display:flex;align-items:center;justify-content:center;
    }
    .logo img{width:100%;height:100%;display:block}
    h1{
      font-size:1.4rem;font-weight:600;margin-bottom:.6rem;
      color:#fff;letter-spacing:-0.02em;
    }
    .brand{color:hsl(150,72%,46%);font-weight:600}
    p{font-size:.9rem;line-height:1.65;color:#9a9aa3;margin-bottom:1.75rem}
    .status{
      display:inline-flex;align-items:center;gap:.55rem;
      margin-bottom:1.5rem;color:#a1a1aa;font-size:.72rem;
      padding:.4rem .85rem;border-radius:999px;
      background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);
      font-weight:500;letter-spacing:.02em;text-transform:uppercase;
    }
    .dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:pulse 1.6s ease-in-out infinite;box-shadow:0 0 8px rgba(239,68,68,.6)}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
    button{
      background:linear-gradient(180deg,hsl(150,72%,46%),hsl(150,72%,40%));
      color:#fff;border:none;
      padding:.95rem 2.25rem;border-radius:999px;
      font-size:.875rem;font-weight:600;letter-spacing:.01em;
      cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
      min-height:48px;width:100%;
      box-shadow:0 12px 32px -8px hsla(150,80%,40%,.5),0 1px 0 rgba(255,255,255,.15) inset;
      transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;
    }
    button:hover{transform:translateY(-1px);box-shadow:0 16px 40px -8px hsla(150,80%,40%,.6),0 1px 0 rgba(255,255,255,.15) inset}
    button:active{opacity:.85;transform:scale(.98)}
    .footnote{margin-top:1.25rem;font-size:.7rem;color:#5e5e68;letter-spacing:.04em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/pwa-icon-192.png" alt="AutoRa" width="72" height="72">
    </div>
    <div class="status"><span class="dot"></span>Hors ligne</div>
    <h1>Connexion interrompue</h1>
    <p>Vos favoris et recherches récentes restent disponibles. Dès que le réseau revient, <span class="brand">AutoRa</span> se synchronise automatiquement.</p>
    <button onclick="location.reload()">Réessayer</button>
    <div class="footnote">🇧🇪 Marketplace automobile belge</div>
  </div>
</body>
</html>
