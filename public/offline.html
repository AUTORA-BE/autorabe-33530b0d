<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <title>AutoRa — Hors ligne</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a14;color:#e5e5e5;min-height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    .container{max-width:340px}
    .logo{width:64px;height:64px;margin:0 auto 1.5rem;border-radius:16px;overflow:hidden}
    .logo img{width:100%;height:100%}
    h1{font-size:1.25rem;font-weight:700;margin-bottom:.5rem;color:#fff}
    p{font-size:.875rem;line-height:1.6;color:#a1a1aa;margin-bottom:1.5rem}
    button{background:#22c55e;color:#fff;border:none;padding:.875rem 2.5rem;border-radius:999px;font-size:.875rem;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:48px}
    button:active{opacity:.8;transform:scale(.97)}
    .status{display:flex;align-items:center;gap:.5rem;justify-content:center;margin-bottom:1.5rem;color:#71717a;font-size:.75rem}
    .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/pwa-icon-192.png" alt="AutoRa" width="64" height="64">
    </div>
    <h1>Vous êtes hors ligne</h1>
    <div class="status"><span class="dot"></span>Aucune connexion détectée</div>
    <p>Vérifiez votre connexion Internet. Vos favoris et recherches récentes seront disponibles dès que vous serez reconnecté.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
